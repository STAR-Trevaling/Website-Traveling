<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 950" width="100%" height="100%" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    
    <!-- UML Markers -->
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F172A" />
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-comp" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,5 8,1 15,5 8,9" fill="#0F172A" stroke="#0F172A" stroke-width="1.5" />
    </marker>
    <marker id="arrow-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" />
    </marker>
    <marker id="arrow-include" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#DA251D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F1F5F9" stroke-width="1"/>
  </pattern>
  <rect width="1650" height="950" fill="url(#grid)" />

  
    
    <g filter="url(#card-shadow)">
      <rect x="40" y="30" width="600" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
      <text x="56" y="56" font-size="14" font-weight="700" fill="#0F172A">STAR Travels — Sơ Đồ Tuần Tự: Tiếp Thị Liên Kết Đối Tác (Affiliate Referral)</text>
      <text x="56" y="76" font-size="11" fill="#475569">Chuẩn: OMG UML 2.5.1 Sequence Diagram | Cơ chế: Non-blocking beacon tracking</text>
      <text x="56" y="94" font-size="11" fill="#64748B" font-style="italic">Phạm vi: Modal cảnh báo 1.5s, navigator.sendBeacon, Outbox event và đồng bộ Odoo CRM Lead</text>
    </g>
    
    
    <g filter="url(#card-shadow)">
      <rect x="1310" y="30" width="300" height="85" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="1326" y="48" font-size="11" font-weight="700" fill="#0F172A">CHÚ GIẢI (LEGEND)</text>
      
        <circle cx="1328" cy="62" r="5" fill="#0F172A"/>
        <text x="1340" y="66" font-size="11" fill="#334155">Tác vụ người dùng / Gọi hệ thống</text>
        

        <circle cx="1328" cy="80" r="5" fill="#DA251D"/>
        <text x="1340" y="84" font-size="11" fill="#334155">Beacon ngầm không chặn luồng trình duyệt</text>
        

        <circle cx="1328" cy="98" r="5" fill="#D97706"/>
        <text x="1340" y="102" font-size="11" fill="#334155">Đồng bộ CRM Lead sang Odoo 18</text>
        
    </g>
    
    
        <rect x="55" y="140" width="150" height="42" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" filter="url(#card-shadow)"/>
        <text x="130" y="157" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Traveler</text>
        <text x="130" y="172" text-anchor="middle" font-size="10" fill="#E2E8F0">(Khách tham quan)</text>
        <line x1="130" y1="182" x2="130" y2="880" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
        
        <rect x="325" y="140" width="150" height="42" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" filter="url(#card-shadow)"/>
        <text x="400" y="157" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Hospitality Catalog</text>
        <text x="400" y="172" text-anchor="middle" font-size="10" fill="#E2E8F0">(/accommodations | /restaurants)</text>
        <line x1="400" y1="182" x2="400" y2="880" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
        
        <rect x="605" y="140" width="150" height="42" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" filter="url(#card-shadow)"/>
        <text x="680" y="157" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Advisory Modal</text>
        <text x="680" y="172" text-anchor="middle" font-size="10" fill="#E2E8F0">(ReferralAdvisoryModal)</text>
        <line x1="680" y1="182" x2="680" y2="880" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
        
        <rect x="885" y="140" width="150" height="42" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" filter="url(#card-shadow)"/>
        <text x="960" y="157" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Django Referral API</text>
        <text x="960" y="172" text-anchor="middle" font-size="10" fill="#E2E8F0">(POST /referrals/track/)</text>
        <line x1="960" y1="182" x2="960" y2="880" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
        
        <rect x="1155" y="140" width="150" height="42" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" filter="url(#card-shadow)"/>
        <text x="1230" y="157" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Transactional Outbox</text>
        <text x="1230" y="172" text-anchor="middle" font-size="10" fill="#E2E8F0">& Celery Worker</text>
        <line x1="1230" y1="182" x2="1230" y2="880" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
        
        <rect x="1405" y="140" width="150" height="42" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" filter="url(#card-shadow)"/>
        <text x="1480" y="157" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Partner Booking Site</text>
        <text x="1480" y="172" text-anchor="middle" font-size="10" fill="#E2E8F0">(Booking.com / Agoda)</text>
        <line x1="1480" y1="182" x2="1480" y2="880" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
        

    <!-- Activations -->
    <rect x="674" y="270" width="12" height="180" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>
    <rect x="954" y="380" width="12" height="130" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>
    <rect x="1224" y="470" width="12" height="140" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>

    <!-- Messages -->
    
        <line x1="130" y1="230" x2="400" y2="230" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="115.0" y="214" width="300" height="14" fill="#FFFFFF" rx="3"/>
        <text x="265.0" y="225" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">1. Click 'Đặt phòng qua Booking.com' / 'Đặt bàn'</text>
        
    
        <line x1="400" y1="280" x2="674" y2="280" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="387.0" y="264" width="300" height="14" fill="#FFFFFF" rx="3"/>
        <text x="537.0" y="275" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">2. Mở Modal thông báo chuyển tiếp đối tác chính hãng (1.5s)</text>
        
    
        <line x1="130" y1="340" x2="674" y2="340" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="252.0" y="324" width="300" height="14" fill="#FFFFFF" rx="3"/>
        <text x="402.0" y="335" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">3. Khách bấm 'Tiếp tục chuyển trang' hoặc đếm ngược</text>
        
    
        <line x1="686" y1="400" x2="954" y2="400" stroke="#DA251D" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="670.0" y="384" width="300" height="14" fill="#FFFFFF" rx="3"/>
        <text x="820.0" y="395" text-anchor="middle" font-size="10.5" font-weight="600" fill="#DA251D">4. navigator.sendBeacon(POST /referrals/track/)</text>
        
    
        <line x1="966" y1="460" x2="1224" y2="460" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="945.0" y="444" width="300" height="14" fill="#FFFFFF" rx="3"/>
        <text x="1095.0" y="455" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">5. Lưu Booking record ('accommodation_referral')</text>
        
    
        <line x1="1236" y1="530" x2="1236" y2="530" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="1086.0" y="514" width="300" height="14" fill="#FFFFFF" rx="3"/>
        <text x="1236.0" y="525" text-anchor="middle" font-size="10.5" font-weight="600" fill="#D97706">6. Đẩy sự kiện CRM Lead sang Odoo 18 [REFERRAL_LEAD]</text>
        
    
        <line x1="674" y1="610" x2="1480" y2="610" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="927.0" y="594" width="300" height="14" fill="#FFFFFF" rx="3"/>
        <text x="1077.0" y="605" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">7. Chuyển hướng trình duyệt sang URL đối tác sau 1.5s</text>
        
    <text x="1480" y="670" text-anchor="middle" font-size="11" font-weight="700" fill="#15803D">✓ Hoàn tất điều hướng an toàn</text>
    
</svg>