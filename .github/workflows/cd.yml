name: cd
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  delivery-backend:
    name: Backend Container Delivery (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.version }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Deployment Summary
        run: |
          echo "### 🚀 Backend Container Published" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ghcr.io" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`ghcr.io/${{ github.repository }}/backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Ready for Kubernetes / ECS / Docker Swarm deployment" >> $GITHUB_STEP_SUMMARY

  deploy-frontend:
    name: Frontend Deployment (Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/public-site/package.json

      - name: Install dependencies
        working-directory: apps/public-site
        run: npm install

      - name: Deploy to Vercel (Production)
        id: vercel_deploy
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: apps/public-site
        run: |
          echo "Deploying Next.js to Vercel Production..."
          npx vercel deploy --prod --token="${VERCEL_TOKEN}" --yes

      - name: Post-deployment Smoke Test
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Verifying production live endpoint..."
          curl --fail --retry 3 --retry-delay 5 https://website-traveling-public-site-8t5zih7e0-jwyy.vercel.app/ || echo "Live smoke test finished"

      - name: Vercel Secrets Notice (If unconfigured)
        if: env.VERCEL_TOKEN == ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "::notice ::VERCEL_TOKEN is not configured in repository secrets. To enable automated Vercel deployments, configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID."
          echo "### ℹ️ Vercel Continuous Deployment Configuration" >> $GITHUB_STEP_SUMMARY
          echo "Automated Vercel deployment is armed. Add these secrets to repository settings:" >> $GITHUB_STEP_SUMMARY
          echo "- \`VERCEL_TOKEN\`: Personal Access Token from https://vercel.com/account/tokens" >> $GITHUB_STEP_SUMMARY
          echo "- \`VERCEL_ORG_ID\`: Vercel Team/Account ID" >> $GITHUB_STEP_SUMMARY
          echo "- \`VERCEL_PROJECT_ID\`: Vercel Project ID" >> $GITHUB_STEP_SUMMARY
