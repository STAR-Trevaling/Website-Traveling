<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 1020" width="100%" height="100%" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    
    <!-- UML Markers -->
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F172A" />
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-comp" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,5 8,1 15,5 8,9" fill="#0F172A" stroke="#0F172A" stroke-width="1.5" />
    </marker>
    <marker id="arrow-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" />
    </marker>
    <marker id="arrow-include" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#DA251D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F1F5F9" stroke-width="1"/>
  </pattern>
  <rect width="1650" height="1020" fill="url(#grid)" />

  
    
    <g filter="url(#card-shadow)">
      <rect x="40" y="30" width="600" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
      <text x="56" y="56" font-size="14" font-weight="700" fill="#0F172A">STAR Travels — Sơ Đồ Máy Trạng Thái (State Machine Diagram)</text>
      <text x="56" y="76" font-size="11" fill="#475569">Chuẩn: OMG UML 2.5.1 State Machine | Quy chuẩn: Trigger [Guard] / Action</text>
      <text x="56" y="94" font-size="11" fill="#64748B" font-style="italic">Phạm vi: 1. Vòng đời Trạng thái Booking | 2. Vòng đời Xét duyệt Đối tác Lữ hành B2B</text>
    </g>
    
    
    <g filter="url(#card-shadow)">
      <rect x="1310" y="30" width="300" height="85" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="1326" y="48" font-size="11" font-weight="700" fill="#0F172A">CHÚ GIẢI (LEGEND)</text>
      
        <circle cx="1328" cy="62" r="5" fill="#0F172A"/>
        <text x="1340" y="66" font-size="11" fill="#334155">Điểm bắt đầu (Initial) / Kết thúc (Final)</text>
        

        <circle cx="1328" cy="80" r="5" fill="#DA251D"/>
        <text x="1340" y="84" font-size="11" fill="#334155">Trạng thái hợp lệ (Active State Box)</text>
        

        <circle cx="1328" cy="98" r="5" fill="#475569"/>
        <text x="1340" y="102" font-size="11" fill="#334155">Chuyển tiếp: Trigger [Guard] / Action</text>
        
    </g>
    

    <!-- 1. Booking State Machine Box -->
    <rect x="60" y="140" width="710" height="830" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
    <rect x="60" y="140" width="710" height="34" rx="10" fill="#E2E8F0"/>
    <text x="415" y="162" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E293B">1. Booking Lifecycle State Machine (bookings_booking)</text>

    <!-- Initial state -->
    <circle cx="415" cy="210" r="14" fill="#1E293B"/>

    
        <g filter="url(#card-shadow)">
          <rect x="305" y="270" width="220" height="65" rx="14" fill="#FEF2F2" stroke="#DA251D" stroke-width="1.8"/>
          <text x="415.0" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#7F1D1D">Pending Payment</text>
          <text x="415.0" y="314" text-anchor="middle" font-size="10.5" fill="#991B1B">(Chờ thanh toán VNPay/VietQR)</text>
        </g>
        
    
        <g filter="url(#card-shadow)">
          <rect x="140" y="450" width="220" height="65" rx="14" fill="#FEF2F2" stroke="#DA251D" stroke-width="1.8"/>
          <text x="250.0" y="476" text-anchor="middle" font-size="12" font-weight="700" fill="#7F1D1D">Confirmed / Paid</text>
          <text x="250.0" y="494" text-anchor="middle" font-size="10.5" fill="#991B1B">(Đã xác nhận & Thanh toán)</text>
        </g>
        
    
        <g filter="url(#card-shadow)">
          <rect x="470" y="450" width="220" height="65" rx="14" fill="#FEF2F2" stroke="#DA251D" stroke-width="1.8"/>
          <text x="580.0" y="476" text-anchor="middle" font-size="12" font-weight="700" fill="#7F1D1D">Failed / Cancelled</text>
          <text x="580.0" y="494" text-anchor="middle" font-size="10.5" fill="#991B1B">(Thất bại / Hủy giữ chỗ)</text>
        </g>
        
    
        <g filter="url(#card-shadow)">
          <rect x="140" y="630" width="220" height="65" rx="14" fill="#FEF2F2" stroke="#DA251D" stroke-width="1.8"/>
          <text x="250.0" y="656" text-anchor="middle" font-size="12" font-weight="700" fill="#7F1D1D">Completed</text>
          <text x="250.0" y="674" text-anchor="middle" font-size="10.5" fill="#991B1B">(Tour hoàn thành)</text>
        </g>
        

    <!-- Final state -->
    <circle cx="415" cy="800" r="14" fill="none" stroke="#0F172A" stroke-width="2"/>
    <circle cx="415" cy="800" r="8" fill="#0F172A"/>

    
        <line x1="415" y1="224" x2="415" y2="270" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="305.0" y="233.0" width="220" height="14" fill="#FFFFFF" rx="2"/>
        <text x="415.0" y="244.0" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Create Booking [valid tour]</text>
        
    
        <line x1="340" y1="335" x2="250" y2="450" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="185.0" y="378.5" width="220" height="14" fill="#FFFFFF" rx="2"/>
        <text x="295.0" y="389.5" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">IPN Success [valid HMAC] / emit_outbox()</text>
        
    
        <line x1="490" y1="335" x2="580" y2="450" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="425.0" y="378.5" width="220" height="14" fill="#FFFFFF" rx="2"/>
        <text x="535.0" y="389.5" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Timeout [>15m] / Gateway Failed</text>
        
    
        <line x1="250" y1="515" x2="250" y2="630" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="140.0" y="558.5" width="220" height="14" fill="#FFFFFF" rx="2"/>
        <text x="250.0" y="569.5" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Trip Finished / create_review_token()</text>
        
    
        <line x1="250" y1="695" x2="401" y2="800" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="215.5" y="733.5" width="220" height="14" fill="#FFFFFF" rx="2"/>
        <text x="325.5" y="744.5" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Close Ledger / archive()</text>
        
    
        <line x1="580" y1="515" x2="429" y2="800" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="394.5" y="643.5" width="220" height="14" fill="#FFFFFF" rx="2"/>
        <text x="504.5" y="654.5" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Release Slot Lock</text>
        

    <!-- 2. Partner Application State Machine Box -->
    <rect x="850" y="140" width="730" height="830" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
    <rect x="850" y="140" width="730" height="34" rx="10" fill="#E2E8F0"/>
    <text x="1215" y="162" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E293B">2. Partner Application State Machine (partners_partnerapplication)</text>

    <circle cx="1215" cy="210" r="14" fill="#1E293B"/>
    
        <g filter="url(#card-shadow)">
          <rect x="1105" y="270" width="220" height="65" rx="14" fill="#FEF2F2" stroke="#DA251D" stroke-width="1.8"/>
          <text x="1215.0" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#7F1D1D">Submitted</text>
          <text x="1215.0" y="314" text-anchor="middle" font-size="10.5" fill="#991B1B">(Đã nộp hồ sơ trực tuyến)</text>
        </g>
        
    
        <g filter="url(#card-shadow)">
          <rect x="1105" y="430" width="220" height="65" rx="14" fill="#FEF2F2" stroke="#DA251D" stroke-width="1.8"/>
          <text x="1215.0" y="456" text-anchor="middle" font-size="12" font-weight="700" fill="#7F1D1D">Under Review</text>
          <text x="1215.0" y="474" text-anchor="middle" font-size="10.5" fill="#991B1B">(Đang thẩm định giấy phép)</text>
        </g>
        
    
        <g filter="url(#card-shadow)">
          <rect x="940" y="610" width="220" height="65" rx="14" fill="#FEF2F2" stroke="#DA251D" stroke-width="1.8"/>
          <text x="1050.0" y="636" text-anchor="middle" font-size="12" font-weight="700" fill="#7F1D1D">Approved</text>
          <text x="1050.0" y="654" text-anchor="middle" font-size="10.5" fill="#991B1B">(Tạo Organization & Nâng quyền)</text>
        </g>
        
    
        <g filter="url(#card-shadow)">
          <rect x="1270" y="610" width="220" height="65" rx="14" fill="#FEF2F2" stroke="#DA251D" stroke-width="1.8"/>
          <text x="1380.0" y="636" text-anchor="middle" font-size="12" font-weight="700" fill="#7F1D1D">Rejected</text>
          <text x="1380.0" y="654" text-anchor="middle" font-size="10.5" fill="#991B1B">(Từ chối có lý do cụ thể)</text>
        </g>
        

    <circle cx="1215" cy="800" r="14" fill="none" stroke="#0F172A" stroke-width="2"/>
    <circle cx="1215" cy="800" r="8" fill="#0F172A"/>

    
        <line x1="1215" y1="224" x2="1215" y2="270" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="1105.0" y="233.0" width="220" height="14" fill="#FFFFFF" rx="2"/>
        <text x="1215.0" y="244.0" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">POST /partner/ [valid MST]</text>
        
    
        <line x1="1215" y1="335" x2="1215" y2="430" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="1105.0" y="368.5" width="220" height="14" fill="#FFFFFF" rx="2"/>
        <text x="1215.0" y="379.5" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Admin opens review</text>
        
    
        <line x1="1140" y1="495" x2="1050" y2="610" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="985.0" y="538.5" width="220" height="14" fill="#FFFFFF" rx="2"/>
        <text x="1095.0" y="549.5" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Approve [atomic] / create_org()</text>
        
    
        <line x1="1290" y1="495" x2="1380" y2="610" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="1225.0" y="538.5" width="220" height="14" fill="#FFFFFF" rx="2"/>
        <text x="1335.0" y="549.5" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Reject [reason provided] / notify()</text>
        
    
        <line x1="1050" y1="675" x2="1201" y2="800" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="1015.5" y="723.5" width="220" height="14" fill="#FFFFFF" rx="2"/>
        <text x="1125.5" y="734.5" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Audit Logged</text>
        
    
        <line x1="1380" y1="675" x2="1229" y2="800" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="1194.5" y="723.5" width="220" height="14" fill="#FFFFFF" rx="2"/>
        <text x="1304.5" y="734.5" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Notify Partner Email</text>
        
    
</svg>