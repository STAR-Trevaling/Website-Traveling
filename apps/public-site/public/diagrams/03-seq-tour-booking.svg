<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 1000" width="100%" height="100%" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    
    <!-- UML Markers -->
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F172A" />
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-comp" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,5 8,1 15,5 8,9" fill="#0F172A" stroke="#0F172A" stroke-width="1.5" />
    </marker>
    <marker id="arrow-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" />
    </marker>
    <marker id="arrow-include" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#DA251D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F1F5F9" stroke-width="1"/>
  </pattern>
  <rect width="1650" height="1000" fill="url(#grid)" />

  
    
    <g filter="url(#card-shadow)">
      <rect x="40" y="30" width="600" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
      <text x="56" y="56" font-size="14" font-weight="700" fill="#0F172A">STAR Travels — Sơ Đồ Tuần Tự: Đặt Tour & Thanh Toán Trực Tuyến</text>
      <text x="56" y="76" font-size="11" fill="#475569">Chuẩn: OMG UML 2.5.1 Sequence Diagram | Cơ chế: Server-side Price Protection</text>
      <text x="56" y="94" font-size="11" fill="#64748B" font-style="italic">Phạm vi: Luồng gọi đồng bộ, thanh kích hoạt (Activation), xác thực chữ ký HMAC SHA512</text>
    </g>
    
    
    <g filter="url(#card-shadow)">
      <rect x="1310" y="30" width="300" height="85" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="1326" y="48" font-size="11" font-weight="700" fill="#0F172A">CHÚ GIẢI (LEGEND)</text>
      
        <circle cx="1328" cy="62" r="5" fill="#0F172A"/>
        <text x="1340" y="66" font-size="11" fill="#334155">Cuộc gọi đồng bộ (Sync Call - Solid Arrow)</text>
        

        <circle cx="1328" cy="80" r="5" fill="#64748B"/>
        <text x="1340" y="84" font-size="11" fill="#334155">Kết quả trả về (Return - Dashed Arrow)</text>
        

        <circle cx="1328" cy="98" r="5" fill="#CBD5E1"/>
        <text x="1340" y="102" font-size="11" fill="#334155">Thanh kích hoạt thực thi (Activation Bar)</text>
        
    </g>
    
    
        <rect x="60" y="140" width="140" height="42" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" filter="url(#card-shadow)"/>
        <text x="130" y="157" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Traveler</text>
        <text x="130" y="172" text-anchor="middle" font-size="10" fill="#E2E8F0">(Trình duyệt)</text>
        <line x1="130" y1="182" x2="130" y2="920" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
        
        <rect x="300" y="140" width="140" height="42" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" filter="url(#card-shadow)"/>
        <text x="370" y="157" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Next.js Web</text>
        <text x="370" y="172" text-anchor="middle" font-size="10" fill="#E2E8F0">(TourBookingCard)</text>
        <line x1="370" y1="182" x2="370" y2="920" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
        
        <rect x="540" y="140" width="140" height="42" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" filter="url(#card-shadow)"/>
        <text x="610" y="157" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">BFF Auth Proxy</text>
        <text x="610" y="172" text-anchor="middle" font-size="10" fill="#E2E8F0">(/api/auth/*)</text>
        <line x1="610" y1="182" x2="610" y2="920" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
        
        <rect x="800" y="140" width="140" height="42" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" filter="url(#card-shadow)"/>
        <text x="870" y="157" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Django Bookings</text>
        <text x="870" y="172" text-anchor="middle" font-size="10" fill="#E2E8F0">(/api/v1/bookings/)</text>
        <line x1="870" y1="182" x2="870" y2="920" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
        
        <rect x="1060" y="140" width="140" height="42" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" filter="url(#card-shadow)"/>
        <text x="1130" y="157" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">PostgreSQL 17</text>
        <text x="1130" y="172" text-anchor="middle" font-size="10" fill="#E2E8F0">(Tour & Ledger)</text>
        <line x1="1130" y1="182" x2="1130" y2="920" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
        
        <rect x="1330" y="140" width="140" height="42" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" filter="url(#card-shadow)"/>
        <text x="1400" y="157" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Payment Gateway</text>
        <text x="1400" y="172" text-anchor="middle" font-size="10" fill="#E2E8F0">(VNPay / VietQR)</text>
        <line x1="1400" y1="182" x2="1400" y2="920" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
        

    <!-- Activations -->
    <rect x="364" y="210" width="12" height="110" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>
    <rect x="864" y="260" width="12" height="180" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>
    <rect x="1124" y="300" width="12" height="120" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>
    <rect x="1394" y="580" width="12" height="180" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>
    <rect x="864" y="700" width="12" height="150" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>

    <!-- Messages -->
    
        <line x1="130" y1="220" x2="364" y2="220" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="107.0" y="204" width="280" height="14" fill="#FFFFFF" rx="3"/>
        <text x="247.0" y="215" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">1. Chọn ngày, số lượng khách -> Bấm 'Đặt ngay'</text>
        
    
        <line x1="376" y1="250" x2="610" y2="250" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="353.0" y="234" width="280" height="14" fill="#FFFFFF" rx="3"/>
        <text x="493.0" y="245" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">2. Gửi request POST kèm HttpOnly Cookie</text>
        
    
        <line x1="610" y1="280" x2="864" y2="280" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="597.0" y="264" width="280" height="14" fill="#FFFFFF" rx="3"/>
        <text x="737.0" y="275" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">3. Forward request + Bearer JWT Header</text>
        
    
        <line x1="876" y1="310" x2="1124" y2="310" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="860.0" y="294" width="280" height="14" fill="#FFFFFF" rx="3"/>
        <text x="1000.0" y="305" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">4. Query Tour.price thật từ DB (Bỏ qua client)</text>
        
    
        <line x1="1124" y1="350" x2="876" y2="350" stroke="#64748B" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow-open)"/>
        <rect x="880.0" y="334" width="240" height="14" fill="#FFFFFF" rx="3"/>
        <text x="1000.0" y="345" text-anchor="middle" font-size="10.5" fill="#475569">5. Trả về Tour record chính xác</text>
        
    
        <line x1="876" y1="390" x2="1124" y2="390" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="860.0" y="374" width="280" height="14" fill="#FFFFFF" rx="3"/>
        <text x="1000.0" y="385" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">6. Calculate total = price * pax & Tạo Booking pending</text>
        
    
        <line x1="864" y1="430" x2="376" y2="430" stroke="#64748B" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow-open)"/>
        <rect x="500.0" y="414" width="240" height="14" fill="#FFFFFF" rx="3"/>
        <text x="620.0" y="425" text-anchor="middle" font-size="10.5" fill="#475569">7. Return Booking ID + Total Price chính xác</text>
        
    
        <line x1="364" y1="480" x2="130" y2="480" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="107.0" y="464" width="280" height="14" fill="#FFFFFF" rx="3"/>
        <text x="247.0" y="475" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">8. Điều hướng sang /booking/[id]/payment</text>
        
    
        <line x1="130" y1="540" x2="1394" y2="540" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="622.0" y="524" width="280" height="14" fill="#FFFFFF" rx="3"/>
        <text x="762.0" y="535" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">9. Chọn VNPay/VietQR -> Tạo payment URL/EMVCo QR</text>
        
    
        <line x1="130" y1="600" x2="1394" y2="600" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="622.0" y="584" width="280" height="14" fill="#FFFFFF" rx="3"/>
        <text x="762.0" y="595" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">10. Du khách quét QR hoặc nhập thẻ thanh toán</text>
        
    
        <line x1="1394" y1="710" x2="876" y2="710" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="995.0" y="694" width="280" height="14" fill="#FFFFFF" rx="3"/>
        <text x="1135.0" y="705" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">11. Webhook Server-to-Server IPN (Xác thực HMAC)</text>
        
    
        <line x1="876" y1="760" x2="1124" y2="760" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="860.0" y="744" width="280" height="14" fill="#FFFFFF" rx="3"/>
        <text x="1000.0" y="755" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">12. Cập nhật Booking -> 'confirmed' & Lưu Ledger</text>
        
    
        <line x1="864" y1="820" x2="376" y2="820" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
        <rect x="480.0" y="804" width="280" height="14" fill="#FFFFFF" rx="3"/>
        <text x="620.0" y="815" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">13. Polling / Webhook báo thành công -> /booking/[id]/success</text>
        
    
        <line x1="364" y1="860" x2="130" y2="860" stroke="#64748B" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow-open)"/>
        <rect x="127.0" y="844" width="240" height="14" fill="#FFFFFF" rx="3"/>
        <text x="247.0" y="855" text-anchor="middle" font-size="10.5" fill="#475569">14. Hiển thị trang hoàn tất chuyến đi</text>
        
    
</svg>